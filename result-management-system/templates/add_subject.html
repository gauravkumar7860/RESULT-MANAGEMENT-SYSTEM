<!DOCTYPE html>
<html>
<head>
    <title>Add Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <a href="/admin/dashboard" class="btn btn-secondary mb-3">← Back</a>

    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h3>Add Subject</h3>
        </div>

        <div class="card-body">
            <form method="POST" action="/admin/add_subject">

                <!-- Class Dropdown -->
                <div class="mb-3">
                    <label class="form-label">Class</label>
                    <select class="form-select" name="class_id" required>
                        <option value="">Select Class</option>
                        {% for cls in classes %}
                        <option value="{{ cls[0] }}">{{ cls[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Subject Name -->
                <div class="mb-3">
                    <label class="form-label">Subject Name</label>
                    <input type="text" class="form-control" name="subject_name" placeholder="Enter subject name" required>
                </div>

                <button type="submit" class="btn btn-warning">Add Subject</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
