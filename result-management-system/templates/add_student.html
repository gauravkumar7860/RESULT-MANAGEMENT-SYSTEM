<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <a href="/admin/dashboard" class="btn btn-secondary mb-3">← Back</a>

    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3>Add New Student</h3>
        </div>

        <div class="card-body">
            <form method="POST" action="/admin/add_student">

                <!-- Student Name -->
                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text" class="form-control" name="name" placeholder="Enter student name" required>
                </div>

                <!-- Roll Number -->
                <div class="mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="text" class="form-control" name="roll_no" placeholder="Enter roll number" required>
                </div>

                <!-- Class Dropdown -->
                <div class="mb-3">
                    <label class="form-label">Class</label>
                    <select class="form-select" name="class_id" required>
                        <option value="">Select Class</option>
                        {% for cls in classes %}
                        <option value="{{ cls[0] }}">{{ cls[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-success">Add Student</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
