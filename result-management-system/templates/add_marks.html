<!DOCTYPE html>
<html>
<head>
    <title>Add Marks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <a href="/admin/dashboard" class="btn btn-secondary mb-3">← Back</a>

    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3>Add Marks</h3>
        </div>

        <div class="card-body">
            <form method="POST" action="/admin/add_marks">

                <!-- Student Dropdown -->
                <div class="mb-3">
                    <label class="form-label">Student</label>
                    <select class="form-select" name="student_id" required>
                        <option value="">Select Student</option>
                        {% for student in students %}
                        <option value="{{ student[0] }}">{{ student[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Subject Dropdown -->
                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <select class="form-select" name="subject_id" required>
                        <option value="">Select Subject</option>
                        {% for subject in subjects %}
                        <option value="{{ subject[0] }}">{{ subject[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Marks Input -->
                <div class="mb-3">
                    <label class="form-label">Marks (0 - 100)</label>
                    <input type="number" class="form-control" name="marks" min="0" max="100" placeholder="Enter marks" required>
                </div>

                <button type="submit" class="btn btn-success">Add Marks</button>

            </form>
        </div>
    </div>
</div>

</body>
</html>
